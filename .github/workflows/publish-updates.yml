name: Publish verified desktop updates

on:
  push:
    branches: [main]
    paths:
      - 'publish/**'
      - 'scripts/publish_signed_releases.cjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-desktop-releases
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signatures and publish Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish_signed_releases.cjs
